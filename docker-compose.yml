services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loophedge-base:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: loophedge:dev
    profiles: ["build-only"]

  data-ingestor:
    image: loophedge:dev
    command: ["ingest"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

  executor:
    image: loophedge:dev
    command: ["execute"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

  risk-monitor:
    image: loophedge:dev
    command: ["risk"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

  dashboard:
    image: loophedge:dev
    command: ["dashboard"]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure:10

  maker-agent:
    image: loophedge:dev
    command: ["maker"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

  checker-agent:
    image: loophedge:dev
    command: ["checker"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

  strategy-genesis-agent:
    image: loophedge:dev
    command: ["genesis"]
    env_file: .env
    volumes:
      - ./skills:/app/skills
      - ./state:/app/state
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: on-failure:10

volumes:
  pg_data:
